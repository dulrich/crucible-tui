name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # CI-only setup: bun run verify's security step calls `bun run
      # test:security`, which uses --skip-db-update (see AGENTS.md's
      # "Security gate bootstrap (trivy)") — that requires a vulnerability DB
      # to already exist, and a fresh runner has no cache. Install Trivy, then
      # warm the DB once (exit-code 0: this is a download, not the gate
      # itself) so the actual scan inside `bun run verify` runs offline like
      # the local gate does.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.73.0
          trivy fs --scanners vuln --exit-code 0 --severity CRITICAL,HIGH .

      # One canonical gate chain (WP-1 of plans/tn-review-remediation.md):
      # typecheck, lint, tests, the compiled build plus a smoke of the built
      # artifact, license freshness, the --check self-smoke, both bundled
      # sweeps, and the security scan above — see AGENTS.md's Run section for
      # the full step list `bun run verify` (scripts/verify.ts) runs, in
      # order. Installation stays outside verify and split by environment:
      # this job freezes (`--frozen-lockfile`, above); a local `bun install`
      # floats.
      - name: Verify
        run: bun run verify

      # Deliberately NOT run here: the fast-tier defect-detector sweep
      # (`bun run sweep -- --corpus regressions --widths 40-360 --detect`).
      # That corpus is a frozen regression set that lives in a private
      # example-harness repo, addressed only via MDVIEW_CORPUS_MANIFEST
      # (see scripts/AGENTS.md's "Corpus sweep" section) — it will never exist on a
      # public runner. Writing a step for it here would either fail every
      # run for a reason contributors can't fix, or silently no-op on
      # missing data and look green while proving nothing. The two sweeps
      # `bun run verify` runs above run for real, against the bundled
      # public-safe manifest (`corpus/default-manifest.json`) that ships with
      # the source; the regression sweep against real corpora is a
      # maintainer-only, local-only verification step (see AGENTS.md), not a
      # CI gate.
