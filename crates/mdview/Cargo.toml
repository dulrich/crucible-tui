[package]
name = "mdview"
version = "0.1.0"
description = "Terminal markdown viewer: lossless wide tables, list reflow, wiki-links"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdview"
path = "src/main.rs"

[dependencies]
# Every runtime dependency the port needs, pinned up front at WP-1 of
# `plans/mdview-rust-port.md` so later work packages never edit this file or Cargo.lock.
# Exact `=x.y.z` pins (root AGENTS.md, "Pins"); a bump is a deliberate change of its own.
comrak = { version = "=0.56.0", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
unicode-segmentation = "=1.13.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
ryu-js = "=1.0.3"
regex = "=1.13.1"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios"] }

[build-dependencies]
# build.rs adds the vendored grammars under `syntaxes/` to two-face's set and dumps it to
# `$OUT_DIR/syntaxes.bin` (WP-6c of `plans/mdview-rust-port.md`). Same pins as the runtime
# deps; only the build side gets `yaml-load`/`dump-create`, so the shipped binary is unchanged.
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "yaml-load", "dump-create"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }

[lints]
workspace = true
