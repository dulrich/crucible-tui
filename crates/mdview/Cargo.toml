[package]
name = "mdview"
version = "0.1.0"
description = "Terminal markdown viewer: lossless wide tables, list reflow, wiki-links"
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdview"
path = "src/main.rs"

[features]
# Token injection for the R-gate (`render-diff --input tokens`): a `tokens` field in a
# `__parity serve` request is deserialized into `token.rs`'s enum and rendered in place of
# the adapter's own lex. Off in the shipped binary; `scripts/revision.ts` builds with it.
parity-tokens = []

[dependencies]
# Every runtime dependency the port needs, pinned up front at WP-1 of
# `plans/mdview-rust-port.md` so later work packages never edit this file or Cargo.lock.
# Exact `=x.y.z` pins (root AGENTS.md, "Pins"); a bump is a deliberate change of its own.
comrak = { version = "=0.56.0", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
yaml-rust2 = { version = "=0.13.0", default-features = false }
unicode-segmentation = "=1.13.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
ryu-js = "=1.0.3"
regex = "=1.13.1"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios"] }

[lints]
workspace = true
